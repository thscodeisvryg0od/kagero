<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oku — KAGERŌ</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=1.0.11">
<link rel="stylesheet" href="css/reader.css?v=1.0.11">
</head>
<body class="kagero-reader">


<div class="progress-bar" id="progressBar"></div>

<div class="reader-topbar" id="topbar">
  <a href="chapters.html" class="back-btn">Bölüm Arşivi</a>
  <div class="chapter-info">
    <div class="jp" id="chapterJp">第1話</div>
    <div class="title" id="chapterTitle">İlk Fısıltı</div>
  </div>
  <div class="reader-controls">
    <svg class="bloom" viewBox="0 0 40 40" aria-hidden="true">
      <g transform="rotate(0 20 20)"><path class="bp" d="M20 20C14 13 14 5 20 3C26 5 26 13 20 20Z"/></g>
      <g transform="rotate(72 20 20)"><path class="bp" d="M20 20C14 13 14 5 20 3C26 5 26 13 20 20Z"/></g>
      <g transform="rotate(144 20 20)"><path class="bp" d="M20 20C14 13 14 5 20 3C26 5 26 13 20 20Z"/></g>
      <g transform="rotate(216 20 20)"><path class="bp" d="M20 20C14 13 14 5 20 3C26 5 26 13 20 20Z"/></g>
      <g transform="rotate(288 20 20)"><path class="bp" d="M20 20C14 13 14 5 20 3C26 5 26 13 20 20Z"/></g>
      <circle class="bc" cx="20" cy="20" r="2.4"/>
    </svg>
        <button class="control-btn" title="Tam Ekran" onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<div class="reader-container" id="readerContainer"></div>

<script src="js/chapters.js"></script>
<script src="js/chapters-en.js"></script>
<script src="js/chapters-jp.js"></script>
<script src="js/i18n.js"></script>
<script>
(function() {
  'use strict';

  const urlParams = new URLSearchParams(window.location.search);
  const chapterNum = parseInt(urlParams.get('ch')) || 1;

  const DEFAULT_DICT = {
    reader: {
      back: 'Bölüm Arşivi',
      prev: 'Önceki Bölüm',
      next: 'Sonraki Bölüm ',
      archive: 'Bölüm Arşivi ',
      bonus: '外伝 — Bonus Bölüm ',
      back_final: 'Final Bölüm',
      to_home: 'Ana Sayfa ',
      page: 'Sayfa',
      comments: '💬 Yorumlar',
      comment_placeholder: 'Bu bölüm hakkında ne düşünüyorsun?',
      comment_send: 'Gönder',
      not_found: 'Bölüm Bulunamadı',
      not_found_desc: 'Bu bölüm mevcut değil.',
      back_to_archive: 'Bölüm Arşivine Dön',
      continue_jp: '次回へ続く',
      continue_tr: 'Devam Edecek',
      read_now: 'Sonraki Bölümü Oku',
      end_of_seri: 'Hikaye Tamamlandı',
      end_of_seri_desc: 'Okuduğun için teşekkürler.'
    }
  };

  function getDict() {
    try {
      if (typeof I18N === 'undefined') return DEFAULT_DICT;
      const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
      return I18N[lang] || I18N.tr || DEFAULT_DICT;
    } catch (e) {
      return DEFAULT_DICT;
    }
  }

  function getChapters() {
    try {
      const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
      if (lang === 'en' && typeof CHAPTERS_EN !== 'undefined' && CHAPTERS_EN[chapterNum]) return CHAPTERS_EN;
      if (lang === 'jp' && typeof CHAPTERS_JP !== 'undefined' && CHAPTERS_JP[chapterNum]) return CHAPTERS_JP;
      return (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    } catch (e) {
      return (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    }
  }

  function getLangParam() {
    const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
    return (lang && lang !== 'tr') ? '&lang=' + lang : '';
  }

  function detectDialogueType(dlg) {
    if (dlg.type !== 'say') return dlg.type;
    
    const text = dlg.text || '';
    const hasExclamation = text.includes('!');
    
    // Sadece harfleri say
    const letters = text.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, '');
    const upperLetters = text.replace(/[^A-ZÇĞİÖŞÜ]/g, '');
    
    // Metin kısa ve tümü büyükse veya çok büyük harf varsa
    if (hasExclamation && letters.length > 0 && upperLetters.length / letters.length > 0.6) {
      return 'shout';
    }
    
    // Fısıltı anahtar kelimeleri
    const whisperWords = ['fısıltı', 'fısıldadı', 'fısıltıyla', 'sessizce'];
    if (whisperWords.some(w => text.toLowerCase().includes(w))) {
      return 'whisper-bubble';
    }
    
    return 'say';
  }

  function loadChapter() {
    const dict = getDict();
    const d = (dict && dict.reader) ? dict.reader : DEFAULT_DICT.reader;
    const chapters = getChapters();
    const chapter = chapters[chapterNum];

    if (!chapter) {
      document.getElementById('readerContainer').innerHTML = `
        <div style="text-align: center; padding: 4rem 2rem;">
          <h2 style="font-family: serif; font-size: 1.5rem; color: #E63946; margin-bottom: 1rem;">${d.not_found}</h2>
          <p style="color: #B0B0B0; margin-bottom: 2rem;">${d.not_found_desc}</p>
          <a href="chapters.html" class="btn btn-primary">${d.back_to_archive}</a>
        </div>
      `;
      return;
    }

    showChapter(chapter, d);
  }

  function showChapter(chapter, d) {
    d = Object.fromEntries(Object.entries(d).map(([k, v]) =>
      [k, typeof v === 'string' ? v.replace(/[←→]/g, '').trim() : v]));
    const langParam = getLangParam();
    const isBonus = chapterNum === 51;
    const isFinal = chapterNum === 50;

    document.getElementById('chapterJp').textContent = chapter.jp || '';
    document.getElementById('chapterTitle').textContent = chapter.title || '';
    document.title = (chapter.title || 'Bölüm') + ' — KAGERŌ';

    const chapterJpEl = document.getElementById('chapterJp');
    if (isBonus) {
      chapterJpEl.classList.add('bonus-stamp');
      document.body.classList.add('bonus-mode');
    } else {
      chapterJpEl.classList.remove('bonus-stamp');
      document.body.classList.remove('bonus-mode');
    }

    const container = document.getElementById('readerContainer');
    let html = '';

    if (!chapter.pages || !Array.isArray(chapter.pages)) {
      container.innerHTML = '<p style="text-align:center; padding:2rem; color:#E63946;">Bu bölümde panel bulunamadı.</p>';
      return;
    }

    html += `<header class="reader-hero">
      <div class="reader-hero-jp">${chapter.jp || ''}</div>
      <h1 class="reader-hero-title">${chapter.title || ''}</h1>
      <div class="reader-hero-rule"></div>
    </header>`;

    chapter.pages.forEach((page, index) => {
      let panelClass = 'panel';
      if (page.type === 'splash') panelClass += ' panel-splash';
      if (page.type === 'closeup') panelClass += ' panel-closeup';

      const mood = detectMood(page.scene);
      html += `<div class="page" id="p${index + 1}" data-page="${index + 1}"${mood ? ` data-mood="${mood}"` : ''}>`;
      html += `<div class="${panelClass}"><div class="panel-image" data-scene="${page.scene || ''}"></div></div>`;

      if (page.dialogue && page.dialogue.length > 0) {
        html += '<div class="panel-dialogue">';
        page.dialogue.forEach(dlg => {
          const type = detectDialogueType(dlg);
          
          if (type === 'say') {
            html += `<div class="dialogue-box"><div class="dialogue-speaker" data-who="${String(dlg.speaker || '').toLowerCase()}">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (type === 'shout') {
            html += `<div class="dialogue-box shout"><div class="dialogue-speaker" data-who="${String(dlg.speaker || '').toLowerCase()}">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (type === 'whisper-bubble') {
            html += `<div class="dialogue-box whisper-bubble"><div class="dialogue-speaker" data-who="${String(dlg.speaker || '').toLowerCase()}">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (dlg.type === 'inner') {
            html += `<div class="inner-voice">${dlg.text || ''}</div>`;
          } else if (dlg.type === 'whisper') {
            html += `<div class="whisper">${dlg.text || ''}</div>`;
          }
        });
        html += '</div>';
      }

      html += `<div class="page-number">${d.page} ${index + 1}</div></div>`;
    });

    // DEVAM EDECEK KARTI
    const allCh = (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    const hasNext = allCh[chapterNum + 1];
    const nextChapterData = hasNext ? allCh[chapterNum + 1] : null;

    if (hasNext && !isFinal) {
      let nextUrl;
      if (chapterNum === 50) {
        nextUrl = `reader.html?ch=51${langParam}`;
      } else {
        nextUrl = `reader.html?ch=${chapterNum + 1}${langParam}`;
      }
      
      const nextTitle = nextChapterData.title || `Bölüm ${chapterNum + 1}`;
      const isBonusNext = chapterNum + 1 === 51;
      
      html += `
        <div class="next-chapter-card ${isBonusNext ? 'is-final' : ''}" id="nextCard">
          <div class="japanese-continue">次回へ続く</div>
          <div class="turkish-continue">${d.continue_tr}</div>
          <div class="chapter-preview">${nextTitle}</div>
          <div class="chapter-preview-sub">${isBonusNext ? '外伝 — Bonus Bölüm' : `第${chapterNum + 1}話`}</div>
          <a href="${nextUrl}" class="next-btn">${d.read_now} </a>
        </div>
      `;
    } else if (isFinal) {
      html += `
        <div class="next-chapter-card is-final" id="nextCard">
          <div class="japanese-continue">外伝</div>
          <div class="turkish-continue">Bonus Bölüm Var</div>
          <div class="chapter-preview">Yeni Nesil — İlk Fısıltı</div>
          <div class="chapter-preview-sub">第51話・外伝</div>
          <a href="reader.html?ch=51${langParam}" class="next-btn">${d.read_now} </a>
        </div>
      `;
    } else if (isBonus) {
      html += `
        <div class="next-chapter-card is-final" id="nextCard">
          <div class="japanese-continue">完</div>
          <div class="turkish-continue">${d.end_of_seri}</div>
          <div class="chapter-preview">${d.end_of_seri_desc}</div>
          <a href="chapters.html" class="next-btn">${d.archive}</a>
        </div>
      `;
    }

    // Navigasyon
    let prevLink, nextLink;

    if (chapterNum === 51) {
      prevLink = `<a href="reader.html?ch=50${langParam}" class="nav-btn">${d.back_final}</a>`;
      nextLink = `<a href="index.html" class="nav-btn bonus-nav">${d.to_home}</a>`;
    } else if (chapterNum === 50) {
      prevLink = `<a href="reader.html?ch=49${langParam}" class="nav-btn">${d.prev}</a>`;
      nextLink = `<a href="reader.html?ch=51${langParam}" class="nav-btn bonus-nav">${d.bonus}</a>`;
    } else {
      prevLink = chapterNum > 1
        ? `<a href="reader.html?ch=${chapterNum - 1}${langParam}" class="nav-btn">${d.prev}</a>`
        : `<a href="#" class="nav-btn disabled">${d.prev}</a>`;

      nextLink = allCh[chapterNum + 1]
        ? `<a href="reader.html?ch=${chapterNum + 1}${langParam}" class="nav-btn">${d.next}</a>`
        : `<a href="chapters.html" class="nav-btn">${d.archive}</a>`;
    }

    html += `<div class="reader-nav">${prevLink}${nextLink}</div>`;
    html += `
      <div class="comments-section">
        <h3 class="comments-title">${d.comments}</h3>
        <textarea class="comment-input" placeholder="${d.comment_placeholder}"></textarea>
        <button class="comment-submit">${d.comment_send}</button>
      </div>
    `;

    container.innerHTML = html;

    const backBtn = document.querySelector('.back-btn');
    if (backBtn) backBtn.textContent = d.back;

    // Sayfa en başa dön
    window.scrollTo(0, 0);

    afterRender(chapter.pages.length);

  }

  // ============================================
  // SAHNE ATMOSFERİ — sahne başlığından ruh hali seçilir
  // ============================================
  const MOOD_RULES = [
    ['fire',      /yangın|alev|ateş|yanan|yanıyor|burning|flame|fire|炎|火事|燃/],
    ['flashback', /geriye dönüş|geri dönüş|yıl önce|^genç |flashback|回想|過去/],
    ['dream',     /rüya|dream|夢/],
    ['rain',      /yağmur|rain|雨/],
    ['lab',       /laborat|研究所|ラボ/],
    ['cemetery',  /mezar|cemetery|grave|墓/],
    ['night',     /gece|ay ışığı|dolunay|night|moonlight|夜(?!明)|月光/],
    ['dawn',      /şafak|gün doğ|sabah|dawn|sunrise|夜明け|朝/],
    ['shrine',    /tapınak|altın çiçek|shrine|temple|golden flower|神社|金の花/]
  ];

  function detectMood(scene) {
    const s = String(scene || '').toLocaleLowerCase('tr');
    for (const [name, re] of MOOD_RULES) if (re.test(s)) return name;
    return '';
  }

  let veils = null;
  function ensureVeils() {
    if (veils) return veils;
    veils = document.createElement('div');
    veils.className = 'mood-veils';
    veils.setAttribute('aria-hidden', 'true');
    MOOD_RULES.forEach(([name]) => {
      const v = document.createElement('i');
      v.className = 'mood-veil';
      v.dataset.m = name;
      veils.appendChild(v);
    });
    document.body.insertBefore(veils, document.body.firstChild);
    return veils;
  }

  function setMood(mood) {
    ensureVeils().querySelectorAll('.mood-veil').forEach((v) => {
      v.classList.toggle('on', v.dataset.m === mood);
    });
  }

  // ============================================
  // KALDIĞIN YERDEN DEVAM
  // Kayıt: localStorage 'kagero_progress' = {ch, page, total, done, ts}
  // ============================================
  let pageObserver = null;
  let currentPage = 0;
  let totalPages = 0;
  let tracking = false;     // kullanıcı kaydırmadan kayıt yazma
  let userTouched = false;  // yazı tipi yüklenince tekrar kaydırma için
  let saveTimer = null;

  ['touchstart', 'wheel', 'keydown', 'mousedown'].forEach((ev) =>
    window.addEventListener(ev, () => { userTouched = true; }, { passive: true }));
  window.addEventListener('scroll', () => { tracking = true; }, { passive: true });

  function saveProgress(page, done) {
    if (!tracking || page < 1) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem('kagero_progress',
          JSON.stringify({ ch: chapterNum, page: page, total: totalPages, done: !!done, ts: Date.now() }));
      } catch (e) {}
    }, 500);
  }

  function readSaved() {
    try { return JSON.parse(localStorage.getItem('kagero_progress') || 'null'); } catch (e) { return null; }
  }

  function scrollToPage(n) {
    const el = document.getElementById('p' + n);
    if (!el) return;
    const top = el.getBoundingClientRect().top + window.scrollY - 72;
    window.scrollTo({ top: Math.max(0, top), behavior: 'instant' });
  }

  function showResumeToast(page) {
    const T = window.KageroText;
    if (!T) return;
    const old = document.getElementById('resumeToast');
    if (old) old.remove();

    const el = document.createElement('div');
    el.id = 'resumeToast';
    el.className = 'resume-toast';
    el.setAttribute('role', 'status');
    el.innerHTML = '<span class="resume-msg"></span>' +
      '<button type="button" class="resume-go"></button>' +
      '<button type="button" class="resume-restart"></button>';
    el.querySelector('.resume-msg').textContent = T.t('resume_msg').replace('{n}', page);
    el.querySelector('.resume-go').textContent = T.t('resume_go');
    el.querySelector('.resume-restart').textContent = T.t('resume_restart');
    document.body.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));

    const hide = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 450); };
    el.querySelector('.resume-go').addEventListener('click', () => { scrollToPage(page); hide(); });
    el.querySelector('.resume-restart').addEventListener('click', hide);
    setTimeout(hide, 15000);
  }

  function afterRender(pageCount) {
    totalPages = pageCount;
    tracking = false;
    userTouched = false;
    currentPage = 0;
    const oldToast = document.getElementById('resumeToast');
    if (oldToast) oldToast.remove();
    setMood('');

    if (pageObserver) pageObserver.disconnect();
    if ('IntersectionObserver' in window) {
      pageObserver = new IntersectionObserver((entries) => {
        entries.forEach((en) => {
          if (!en.isIntersecting) return;
          const t = en.target;
          if (t.id === 'nextCard') { saveProgress(totalPages, true); return; }
          if (t.classList.contains('reader-hero')) { currentPage = 0; setMood(''); return; }
          const n = parseInt(t.dataset.page, 10);
          currentPage = n;
          setMood(t.dataset.mood || '');
          saveProgress(n, false);
        });
      }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
      document.querySelectorAll('.reader-hero, .page, #nextCard').forEach((el) => pageObserver.observe(el));
    }

    // Nereye dönülecek? (dil değişimi > adres #pN > kayıtlı konum)
    const forced = window.__resumePage || 0;
    window.__resumePage = 0;
    const hashMatch = /^#p(\d+)$/.exec(window.location.hash || '');
    let target = 0;
    let silent = false;
    if (forced > 1) { target = forced; silent = true; }
    else if (hashMatch) { target = parseInt(hashMatch[1], 10); silent = true; }

    if (silent && target > 1 && target <= totalPages) {
      scrollToPage(target);
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { if (!userTouched) scrollToPage(target); });
      }
      return;
    }

    const saved = readSaved();
    if (saved && saved.ch === chapterNum && saved.page >= 2 && saved.page <= totalPages && !saved.done) {
      showResumeToast(saved.page);
    }
  }

  // Okuma ilerlemesi: hayalet çiçek açılır
  function setBloom() {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(1, window.scrollY / max) : 0;
    document.documentElement.style.setProperty('--p', p.toFixed(3));
  }
  let bloomRaf = false;
  window.addEventListener('scroll', () => {
    if (!bloomRaf) {
      bloomRaf = true;
      requestAnimationFrame(() => { setBloom(); bloomRaf = false; });
    }
  }, { passive: true });

  window.loadChapter = loadChapter;

  function waitAndLoad() {
    if (typeof ALL_CHAPTERS !== 'undefined') {
      loadChapter();
    } else {
      setTimeout(waitAndLoad, 50);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndLoad);
  } else {
    waitAndLoad();
  }

  window.addEventListener('languageChanged', () => {
    window.__resumePage = currentPage;
    setTimeout(loadChapter, 50);
  });
})();
</script>
<script src="js/main.js?v=1.0.11"></script>
</body>
</html>
