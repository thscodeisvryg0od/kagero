<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oku — KAGERŌ</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/reader.css">
</head>
<body class="kagero-reader">


<div class="progress-bar" id="progressBar"></div>

<div class="reader-topbar" id="topbar">
  <a href="chapters.html" class="back-btn">← Bölüm Arşivi</a>
  <div class="chapter-info">
    <div class="jp" id="chapterJp">第1話</div>
    <div class="title" id="chapterTitle">İlk Fısıltı</div>
  </div>
  <div class="reader-controls">
    <button class="control-btn" title="Tam Ekran" onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<div class="reader-container" id="readerContainer"></div>

<script src="js/chapters.js"></script>
<script src="js/chapters-en.js"></script>
<script src="js/chapters-jp.js"></script>
<script src="js/i18n.js"></script>
<script>
(function() {
  'use strict';

  const urlParams = new URLSearchParams(window.location.search);
  const chapterNum = parseInt(urlParams.get('ch')) || 1;

  const DEFAULT_DICT = {
    reader: {
      back: '← Bölüm Arşivi',
      prev: '← Önceki Bölüm',
      next: 'Sonraki Bölüm →',
      archive: 'Bölüm Arşivi →',
      bonus: '外伝 — Bonus Bölüm →',
      back_final: '← Final Bölüm',
      to_home: 'Ana Sayfa →',
      page: 'Sayfa',
      comments: '💬 Yorumlar',
      comment_placeholder: 'Bu bölüm hakkında ne düşünüyorsun?',
      comment_send: 'Gönder',
      not_found: 'Bölüm Bulunamadı',
      not_found_desc: 'Bu bölüm mevcut değil.',
      back_to_archive: 'Bölüm Arşivine Dön',
      continue_jp: '次回へ続く',
      continue_tr: 'Devam Edecek',
      read_now: 'Sonraki Bölümü Oku',
      end_of_seri: 'Hikaye Tamamlandı',
      end_of_seri_desc: 'Okuduğun için teşekkürler.'
    }
  };

  function getDict() {
    try {
      if (typeof I18N === 'undefined') return DEFAULT_DICT;
      const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
      return I18N[lang] || I18N.tr || DEFAULT_DICT;
    } catch (e) {
      return DEFAULT_DICT;
    }
  }

  function getChapters() {
    try {
      const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
      if (lang === 'en' && typeof CHAPTERS_EN !== 'undefined' && CHAPTERS_EN[chapterNum]) return CHAPTERS_EN;
      if (lang === 'jp' && typeof CHAPTERS_JP !== 'undefined' && CHAPTERS_JP[chapterNum]) return CHAPTERS_JP;
      return (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    } catch (e) {
      return (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    }
  }

  function getLangParam() {
    const lang = (window.i18n && window.i18n.currentLang) ? window.i18n.currentLang : 'tr';
    return (lang && lang !== 'tr') ? '&lang=' + lang : '';
  }

  function detectDialogueType(dlg) {
    if (dlg.type !== 'say') return dlg.type;
    
    const text = dlg.text || '';
    const hasExclamation = text.includes('!');
    
    // Sadece harfleri say
    const letters = text.replace(/[^A-Za-zÇĞİÖŞÜçğıöşü]/g, '');
    const upperLetters = text.replace(/[^A-ZÇĞİÖŞÜ]/g, '');
    
    // Metin kısa ve tümü büyükse veya çok büyük harf varsa
    if (hasExclamation && letters.length > 0 && upperLetters.length / letters.length > 0.6) {
      return 'shout';
    }
    
    // Fısıltı anahtar kelimeleri
    const whisperWords = ['fısıltı', 'fısıldadı', 'fısıltıyla', 'sessizce'];
    if (whisperWords.some(w => text.toLowerCase().includes(w))) {
      return 'whisper-bubble';
    }
    
    return 'say';
  }

  function loadChapter() {
    const dict = getDict();
    const d = (dict && dict.reader) ? dict.reader : DEFAULT_DICT.reader;
    const chapters = getChapters();
    const chapter = chapters[chapterNum];

    if (!chapter) {
      document.getElementById('readerContainer').innerHTML = `
        <div style="text-align: center; padding: 4rem 2rem;">
          <h2 style="font-family: serif; font-size: 1.5rem; color: #E63946; margin-bottom: 1rem;">${d.not_found}</h2>
          <p style="color: #B0B0B0; margin-bottom: 2rem;">${d.not_found_desc}</p>
          <a href="chapters.html" class="btn btn-primary">${d.back_to_archive}</a>
        </div>
      `;
      return;
    }

    showChapter(chapter, d);
  }

  function showChapter(chapter, d) {
    const langParam = getLangParam();
    const isBonus = chapterNum === 51;
    const isFinal = chapterNum === 50;

    document.getElementById('chapterJp').textContent = chapter.jp || '';
    document.getElementById('chapterTitle').textContent = chapter.title || '';
    document.title = (chapter.title || 'Bölüm') + ' — KAGERŌ';

    const chapterJpEl = document.getElementById('chapterJp');
    if (isBonus) {
      chapterJpEl.classList.add('bonus-stamp');
      document.body.classList.add('bonus-mode');
    } else {
      chapterJpEl.classList.remove('bonus-stamp');
      document.body.classList.remove('bonus-mode');
    }

    const container = document.getElementById('readerContainer');
    let html = '';

    if (!chapter.pages || !Array.isArray(chapter.pages)) {
      container.innerHTML = '<p style="text-align:center; padding:2rem; color:#E63946;">Bu bölümde panel bulunamadı.</p>';
      return;
    }

    chapter.pages.forEach((page, index) => {
      let panelClass = 'panel';
      if (page.type === 'splash') panelClass += ' panel-splash';
      if (page.type === 'closeup') panelClass += ' panel-closeup';

      html += '<div class="page">';
      html += `<div class="${panelClass}"><div class="panel-image" data-scene="${page.scene || ''}"></div></div>`;

      if (page.dialogue && page.dialogue.length > 0) {
        html += '<div class="panel-dialogue">';
        page.dialogue.forEach(dlg => {
          const type = detectDialogueType(dlg);
          
          if (type === 'say') {
            html += `<div class="dialogue-box"><div class="dialogue-speaker">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (type === 'shout') {
            html += `<div class="dialogue-box shout"><div class="dialogue-speaker">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (type === 'whisper-bubble') {
            html += `<div class="dialogue-box whisper-bubble"><div class="dialogue-speaker">${dlg.speaker || ''}</div><div class="dialogue-text">${dlg.text || ''}</div></div>`;
          } else if (dlg.type === 'inner') {
            html += `<div class="inner-voice">${dlg.text || ''}</div>`;
          } else if (dlg.type === 'whisper') {
            html += `<div class="whisper">${dlg.text || ''}</div>`;
          }
        });
        html += '</div>';
      }

      html += `<div class="page-number">${d.page} ${index + 1}</div></div>`;
    });

    // DEVAM EDECEK KARTI
    const allCh = (typeof ALL_CHAPTERS !== 'undefined') ? ALL_CHAPTERS : {};
    const hasNext = allCh[chapterNum + 1];
    const nextChapterData = hasNext ? allCh[chapterNum + 1] : null;

    if (hasNext && !isFinal) {
      let nextUrl;
      if (chapterNum === 50) {
        nextUrl = `reader.html?ch=51${langParam}`;
      } else {
        nextUrl = `reader.html?ch=${chapterNum + 1}${langParam}`;
      }
      
      const nextTitle = nextChapterData.title || `Bölüm ${chapterNum + 1}`;
      const isBonusNext = chapterNum + 1 === 51;
      
      html += `
        <div class="next-chapter-card ${isBonusNext ? 'is-final' : ''}" id="nextCard">
          <div class="japanese-continue">次回へ続く</div>
          <div class="turkish-continue">${d.continue_tr}</div>
          <div class="chapter-preview">${nextTitle}</div>
          <div class="chapter-preview-sub">${isBonusNext ? '外伝 — Bonus Bölüm' : `第${chapterNum + 1}話`}</div>
          <a href="${nextUrl}" class="next-btn">${d.read_now} →</a>
        </div>
      `;
    } else if (isFinal) {
      html += `
        <div class="next-chapter-card is-final" id="nextCard">
          <div class="japanese-continue">外伝</div>
          <div class="turkish-continue">Bonus Bölüm Var</div>
          <div class="chapter-preview">Yeni Nesil — İlk Fısıltı</div>
          <div class="chapter-preview-sub">第51話・外伝</div>
          <a href="reader.html?ch=51${langParam}" class="next-btn">${d.read_now} →</a>
        </div>
      `;
    } else if (isBonus) {
      html += `
        <div class="next-chapter-card is-final" id="nextCard">
          <div class="japanese-continue">完</div>
          <div class="turkish-continue">${d.end_of_seri}</div>
          <div class="chapter-preview">${d.end_of_seri_desc}</div>
          <a href="chapters.html" class="next-btn">${d.archive}</a>
        </div>
      `;
    }

    // Navigasyon
    let prevLink, nextLink;

    if (chapterNum === 51) {
      prevLink = `<a href="reader.html?ch=50${langParam}" class="nav-btn">${d.back_final}</a>`;
      nextLink = `<a href="index.html" class="nav-btn bonus-nav">${d.to_home}</a>`;
    } else if (chapterNum === 50) {
      prevLink = `<a href="reader.html?ch=49${langParam}" class="nav-btn">${d.prev}</a>`;
      nextLink = `<a href="reader.html?ch=51${langParam}" class="nav-btn bonus-nav">${d.bonus}</a>`;
    } else {
      prevLink = chapterNum > 1
        ? `<a href="reader.html?ch=${chapterNum - 1}${langParam}" class="nav-btn">${d.prev}</a>`
        : `<a href="#" class="nav-btn disabled">${d.prev}</a>`;

      nextLink = allCh[chapterNum + 1]
        ? `<a href="reader.html?ch=${chapterNum + 1}${langParam}" class="nav-btn">${d.next}</a>`
        : `<a href="chapters.html" class="nav-btn">${d.archive}</a>`;
    }

    html += `<div class="reader-nav">${prevLink}${nextLink}</div>`;
    html += `
      <div class="comments-section">
        <h3 class="comments-title">${d.comments}</h3>
        <textarea class="comment-input" placeholder="${d.comment_placeholder}"></textarea>
        <button class="comment-submit">${d.comment_send}</button>
      </div>
    `;

    container.innerHTML = html;

    const backBtn = document.querySelector('.back-btn');
    if (backBtn) backBtn.textContent = d.back;

    // Sayfa en başa dön
    window.scrollTo(0, 0);

  }

  function setupScrollReveal() {
    // Body'e işaret koy — CSS sadece bu varsa gizlesin
    document.body.classList.add('js-scroll-reveal');

    const pages = document.querySelectorAll('.page');
    const nextCard = document.getElementById('nextCard');

    // Emniyet kemeri: 2 saniye sonra her şeyi görünür yap
    const safetyTimer = setTimeout(() => {
      pages.forEach(p => p.classList.add('visible'));
      if (nextCard) nextCard.classList.add('show');
    }, 2000);

    if ('IntersectionObserver' in window) {
      const pageObserver = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            pageObserver.unobserve(entry.target);
          }
        });
      }, {
        threshold: 0.05,
        rootMargin: '0px 0px -50px 0px'
      });

      pages.forEach((page, i) => {
        if (i < 2) {
          page.classList.add('visible');
        } else {
          pageObserver.observe(page);
        }
      });

      if (nextCard) {
        const cardObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('show');
              cardObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        cardObserver.observe(nextCard);
      }
    } else {
      // Fallback
      clearTimeout(safetyTimer);
      pages.forEach(p => p.classList.add('visible'));
      if (nextCard) nextCard.classList.add('show');
    }
  }

  window.loadChapter = loadChapter;

  function waitAndLoad() {
    if (typeof ALL_CHAPTERS !== 'undefined') {
      loadChapter();
    } else {
      setTimeout(waitAndLoad, 50);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', waitAndLoad);
  } else {
    waitAndLoad();
  }

  window.addEventListener('languageChanged', () => {
    setTimeout(loadChapter, 50);
  });
})();
</script>
<script src="js/main.js"></script>
</body>
</html>
