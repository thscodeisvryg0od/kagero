<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oku — KAGERŌ</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="progress-bar" id="progressBar"></div>

<div class="reader-topbar" id="topbar">
  <a href="chapters.html" class="back-btn">← Bölüm Arşivi</a>
  <div class="chapter-info">
    <div class="jp" id="chapterJp">第1話</div>
    <div class="title" id="chapterTitle">İlk Fısıltı</div>
  </div>
  <div class="reader-controls">
    <button class="control-btn" title="Tam Ekran" onclick="toggleFullscreen()">⛶</button>
  </div>
</div>

<div class="reader-container" id="readerContainer">
  <div style="text-align: center; padding: 4rem 2rem; color: #B0B0B0;">
    <p>Yükleniyor...</p>
  </div>
</div>

<script src="js/chapters.js"></script>
<script>
(function() {
  // DEBUG: chapters.js yüklendi mi?
  if (typeof ALL_CHAPTERS === 'undefined') {
    document.getElementById('readerContainer').innerHTML = `
      <div style="text-align: center; padding: 4rem 2rem;">
        <h2 style="font-family: serif; font-size: 1.5rem; color: #E63946; margin-bottom: 1rem;">⚠️ Hata: chapters.js Yüklenemedi</h2>
        <p style="color: #B0B0B0; margin-bottom: 1rem;">chapters.js dosyasında bir syntax hatası var. GitHub'da dosyayı kontrol edin:</p>
        <p style="color: #F4A261; font-size: 0.9rem;">1. Dosyanın en sonunda <strong>};</strong> var mı?<br>
        2. Virgüller doğru mu? (fazla virgül = hata)<br>
        3. Süslü parantez <strong>{ }</strong> sayıları denk mi?</p>
        <a href="chapters.html" style="display: inline-block; margin-top: 2rem; padding: 1rem 2rem; background: #E63946; color: white; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px;">Bölüm Arşivine Dön</a>
      </div>
    `;
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const chapterNum = parseInt(urlParams.get('ch')) || 1;
  const chapter = ALL_CHAPTERS[chapterNum];

  if (!chapter) {
    document.getElementById('readerContainer').innerHTML = `
      <div style="text-align: center; padding: 4rem 2rem;">
        <h2 style="font-family: serif; font-size: 1.5rem; color: #E63946; margin-bottom: 1rem;">Bölüm Bulunamadı</h2>
        <p style="color: #B0B0B0; margin-bottom: 2rem;">Bölüm ${chapterNum} mevcut değil.</p>
        <a href="chapters.html" style="display: inline-block; padding: 1rem 2rem; background: #E63946; color: white; text-decoration: none; font-size: 0.85rem; letter-spacing: 2px;">Bölüm Arşivine Dön</a>
      </div>
    `;
    return;
  }

  document.getElementById('chapterJp').textContent = chapter.jp;
  document.getElementById('chapterTitle').textContent = chapter.title;
  document.title = `Bölüm ${chapterNum}: ${chapter.title} — KAGERŌ`;

  const container = document.getElementById('readerContainer');
  let html = '';

  chapter.pages.forEach((page, index) => {
    let panelClass = 'panel';
    if (page.type === 'splash') panelClass += ' panel-splash';
    if (page.type === 'closeup') panelClass += ' panel-closeup';

    html += '<div class="page">';
    html += `<div class="${panelClass}"><div class="panel-image" data-scene="${page.scene}"></div></div>`;

    if (page.dialogue && page.dialogue.length > 0) {
      html += '<div class="panel-dialogue">';
      page.dialogue.forEach(d => {
        if (d.type === 'say') {
          html += `<div class="dialogue-box"><div class="dialogue-speaker">${d.speaker}</div><div class="dialogue-text">${d.text}</div></div>`;
        } else if (d.type === 'inner') {
          html += `<div class="inner-voice">${d.text}</div>`;
        } else if (d.type === 'whisper') {
          html += `<div class="whisper">${d.text}</div>`;
        }
      });
      html += '</div>';
    }

    html += `<div class="page-number">Sayfa ${index + 1}</div></div>`;
  });

  const prevLink = chapterNum > 1 
    ? `<a href="reader.html?ch=${chapterNum - 1}" class="nav-btn">← Önceki Bölüm</a>`
    : `<a href="#" class="nav-btn disabled">← Önceki Bölüm</a>`;
  
  const nextLink = ALL_CHAPTERS[chapterNum + 1]
    ? `<a href="reader.html?ch=${chapterNum + 1}" class="nav-btn">Sonraki Bölüm →</a>`
    : `<a href="chapters.html" class="nav-btn">Bölüm Arşivi →</a>`;

  html += `<div class="reader-nav">${prevLink}${nextLink}</div>`;
  html += `
    <div class="comments-section">
      <h3 class="comments-title">💬 Yorumlar</h3>
      <textarea class="comment-input" placeholder="Bu bölüm hakkında ne düşünüyorsun?"></textarea>
      <button class="comment-submit">Gönder</button>
    </div>
  `;

  container.innerHTML = html;
})();
</script>
<script src="js/main.js"></script>
</body>
</html>
