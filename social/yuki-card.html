<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Yuki Card — KAGERŌ</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { 
    background: #000; 
    display: flex; 
    align-items: center; 
    justify-content: center; 
    min-height: 100vh; 
    font-family: 'Inter', sans-serif;
  }
  .card {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    color: white;
    background: #0A0A0A;
    /* Border effect */
    border: 12px solid #0A0A0A;
    outline: 3px solid #E63946;
    outline-offset: -6px;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }

  /* SVG tam arka planda */
  .portrait-bg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .portrait-bg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    transform: scale(1.15);
    /* Alt tarafı yumuşakça karart */
    -webkit-mask-image: linear-gradient(180deg, black 0%, black 45%, rgba(0,0,0,0.4) 65%, transparent 85%);
    mask-image: linear-gradient(180deg, black 0%, black 45%, rgba(0,0,0,0.4) 65%, transparent 85%);
  }

  /* Kırmızı radial glow — arka plan */
  .glow {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center 40%, rgba(230,57,70,0.25) 0%, transparent 60%);
    pointer-events: none;
    z-index: 1;
  }

  /* Screentone doku */
  .screentone {
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 4px 4px, rgba(230,57,70,0.1) 1.5px, transparent 2px);
    background-size: 22px 22px;
    pointer-events: none;
    z-index: 2;
    opacity: 0.7;
  }

  /* Alt gradient — metin okunabilirliği için */
  .bottom-gradient {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 55%;
    background: linear-gradient(180deg, transparent 0%, rgba(10,10,10,0.6) 30%, rgba(10,10,10,0.98) 75%, #0A0A0A 100%);
    z-index: 3;
    pointer-events: none;
  }

  /* Sol üst: Bölüm damgası */
  .stamp {
    position: absolute;
    top: 50px;
    left: 50px;
    background: #B71C1C;
    color: white;
    padding: 14px 28px;
    font-family: 'Shippori Mincho', serif;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 4px;
    border: 3px solid white;
    transform: rotate(-3deg);
    box-shadow: 6px 6px 0 rgba(0,0,0,0.9);
    z-index: 10;
  }

  /* Sağ üst: Rol etiketi */
  .role-tag {
    position: absolute;
    top: 50px;
    right: 50px;
    color: #E63946;
    font-family: 'Cinzel', serif;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    z-index: 10;
    text-align: right;
    line-height: 1.6;
  }
  .role-tag::before {
    content: '◆ PROTAGONIST';
    display: block;
    color: #F4A261;
    font-size: 12px;
    letter-spacing: 4px;
    margin-bottom: 6px;
    opacity: 0.8;
  }

  /* Alt kısım — metin bilgileri */
  .info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 0 70px 70px;
    z-index: 5;
    text-align: left;
  }

  .jp-name {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 22px;
    color: #E63946;
    letter-spacing: 14px;
    margin-bottom: 14px;
    font-weight: 500;
  }

  .name {
    font-family: 'Cinzel', serif;
    font-size: 96px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 0.95;
    background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 40%, #E63946 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 30px;
    text-transform: uppercase;
  }

  .role-box {
    display: inline-block;
    padding: 10px 24px;
    border: 2px solid #E63946;
    color: #E63946;
    font-size: 15px;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 35px;
    font-weight: 700;
    background: rgba(230,57,70,0.08);
  }

  .tagline {
    font-style: italic;
    color: #F4A261;
    font-size: 22px;
    line-height: 1.55;
    padding-left: 28px;
    border-left: 4px solid #F4A261;
    max-width: 900px;
    font-weight: 300;
  }

  /* Alt sol: Site URL */
  .footer-url {
    position: absolute;
    bottom: 30px;
    left: 70px;
    font-size: 13px;
    color: #666;
    letter-spacing: 4px;
    font-weight: 500;
    z-index: 6;
  }

  /* Alt sağ: KAGERŌ logo */
  .logo {
    position: absolute;
    bottom: 25px;
    right: 70px;
    font-family: 'Cinzel', serif;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: 4px;
    z-index: 6;
    color: white;
  }
  .logo span {
    color: #E63946;
    font-family: 'Noto Sans JP', sans-serif;
  }
  .logo::before {
    content: '';
    position: absolute;
    left: -20px;
    top: 50%;
    transform: translateY(-50%);
    width: 8px;
    height: 8px;
    background: #E63946;
    border-radius: 50%;
  }

  /* Köşe süsler */
  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid #E63946;
    z-index: 8;
  }
  .corner.tl { top: 20px; left: 20px; border-right: none; border-bottom: none; }
  .corner.tr { top: 20px; right: 20px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 20px; left: 20px; border-right: none; border-top: none; }
  .corner.br { bottom: 20px; right: 20px; border-left: none; border-top: none; }
</style>
</head>
<body>
  <div class="card">
    <!-- SVG arka plan -->
    <div class="portrait-bg">
      <img src="../assets/character-yuki.svg" alt="Yuki Ayanokōji">
    </div>

    <!-- Efektler -->
    <div class="glow"></div>
    <div class="screentone"></div>
    <div class="bottom-gradient"></div>

    <!-- Köşe süsler -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- Üst damga -->
    <div class="stamp">第01話</div>
    <div class="role-tag">CHARACTER FILE</div>

    <!-- Alt bilgi -->
    <div class="info">
      <div class="jp-name">綾小路 雪</div>
      <div class="name">Yuki Ayanokōji</div>
      <div class="role-box">Kan'nōsha</div>
      <div class="tagline">"Ben zaten çoktan kayboldum. Ama belki... belki birinin beni bulmasına izin verebilirim."</div>
    </div>

    <!-- Alt URL ve logo -->
    <div class="footer-url">KAGERO.COM</div>
    <div class="logo">KAGER<span>Ō</span></div>
  </div>
</body>
</html>
