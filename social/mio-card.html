<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mio Card — KAGERŌ</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&family=Shippori+Mincho:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: 'Inter', sans-serif; }
  .card {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    color: white; background: #0A0A0A;
    border: 3px solid #FF69B4;
    box-shadow: inset 0 0 0 8px #0A0A0A, inset 0 0 0 9px rgba(255,105,180,0.4), inset 0 0 120px rgba(0,0,0,0.6);
  }
  .portrait-bg { position: absolute; inset: 0; overflow: hidden; z-index: 1; }
  .portrait-bg img { width: 100%; height: 100%; object-fit: cover; object-position: center top; display: block; }
  .glow { position: absolute; inset: 0; background: radial-gradient(ellipse at center 45%, rgba(255,105,180,0.22) 0%, transparent 55%); pointer-events: none; z-index: 2; }
  .screentone { position: absolute; inset: 0; background-image: radial-gradient(circle at 4px 4px, rgba(255,105,180,0.08) 1px, transparent 1.5px); background-size: 22px 22px; pointer-events: none; z-index: 3; opacity: 0.6; }
  .bottom-gradient { position: absolute; bottom: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, transparent 0%, rgba(10,10,10,0.3) 30%, rgba(10,10,10,0.85) 65%, #0A0A0A 100%); z-index: 4; pointer-events: none; }
  .corner { position: absolute; width: 36px; height: 36px; border: 3px solid #FF69B4; z-index: 8; }
  .corner.tl { top: 24px; left: 24px; border-right: none; border-bottom: none; }
  .corner.tr { top: 24px; right: 24px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 24px; left: 24px; border-right: none; border-top: none; }
  .corner.br { bottom: 24px; right: 24px; border-left: none; border-top: none; }
  .stamp { position: absolute; top: 55px; left: 55px; background: #BE185D; color: white; padding: 12px 26px; font-family: 'Shippori Mincho', serif; font-size: 20px; font-weight: 800; letter-spacing: 4px; border: 2px solid white; transform: rotate(-3deg); box-shadow: 5px 5px 0 rgba(0,0,0,0.9); z-index: 10; }
  .role-tag { position: absolute; top: 55px; right: 55px; text-align: right; z-index: 10; }
  .role-tag .sub { color: #FFB6D9; font-family: 'Cinzel', serif; font-size: 11px; letter-spacing: 5px; margin-bottom: 8px; font-weight: 600; opacity: 0.9; }
  .role-tag .main { color: #FF69B4; font-family: 'Cinzel', serif; font-size: 18px; font-weight: 700; letter-spacing: 5px; }
  .info { position: absolute; bottom: 0; left: 0; right: 0; padding: 0 65px 65px; z-index: 6; }
  .jp-name { font-family: 'Noto Sans JP', sans-serif; font-size: 20px; color: #FF69B4; letter-spacing: 12px; margin-bottom: 12px; font-weight: 500; }
  .name { font-family: 'Cinzel', serif; font-size: 88px; font-weight: 900; letter-spacing: 3px; line-height: 0.95; background: linear-gradient(135deg, #FFFFFF 0%, #FFFFFF 30%, #FF69B4 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 26px; text-transform: uppercase; }
  .role-box { display: inline-block; padding: 9px 22px; border: 2px solid #FF69B4; color: #FF69B4; font-size: 14px; letter-spacing: 5px; text-transform: uppercase; margin-bottom: 32px; font-weight: 700; background: rgba(255,105,180,0.1); }
  .tagline { font-style: italic; color: #FFB6D9; font-size: 20px; line-height: 1.55; padding-left: 26px; border-left: 4px solid #FFB6D9; max-width: 900px; font-weight: 300; }
  .footer-url { position: absolute; bottom: 26px; left: 65px; font-size: 12px; color: #555; letter-spacing: 4px; font-weight: 500; z-index: 7; }
  .logo { position: absolute; bottom: 22px; right: 65px; font-family: 'Cinzel', serif; font-size: 30px; font-weight: 900; letter-spacing: 4px; z-index: 7; color: white; }
  .logo span { color: #FF69B4; font-family: inherit; }
</style>
</head>
<body>
  <div class="card">
    <div class="portrait-bg">
      <img src="../assets/character-mio.svg" alt="Mio Sakuraba">
    </div>
    <div class="glow"></div>
    <div class="screentone"></div>
    <div class="bottom-gradient"></div>
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="stamp">第04話</div>
    <div class="role-tag">
      <div class="sub">◆ SUPPORT</div>
      <div class="main">CHARACTER FILE</div>
    </div>
    <div class="info">
      <div class="jp-name">桜庭 美桜</div>
      <div class="name">Mio Sakuraba</div>
      <div class="role-box">Gazeteci</div>
      <div class="tagline">"Bir gazeteci olarak... gerçeği yazmak zorundayım. Ama önce... senin yanında olmak istiyorum."</div>
    </div>
    <div class="footer-url">KAGERO.COM</div>
    <div class="logo">KAGER<span>Ō</span></div>
  </div>
</body>
</html>
