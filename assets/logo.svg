<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D1B3D"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="400" height="420" fill="#0A0A0A"/>

  <circle cx="200" cy="180" r="120" fill="none" stroke="url(#ringGradient)" stroke-width="3"/>
  <circle cx="200" cy="180" r="105" fill="none" stroke="url(#ringGradient)" stroke-width="1.5" opacity="0.5"/>
  <circle cx="200" cy="180" r="90" fill="url(#innerGlow)" stroke="#E63946" stroke-width="1" opacity="0.8"/>

  <g filter="url(#glow)" transform="translate(200,180)">
    <ellipse cx="0" cy="-25" rx="8" ry="20" fill="#E63946" opacity="0.9"/>
    <ellipse cx="24" cy="-8" rx="8" ry="20" fill="#E63946" opacity="0.9" transform="rotate(72)"/>
    <ellipse cx="15" cy="21" rx="8" ry="20" fill="#E63946" opacity="0.9" transform="rotate(144)"/>
    <ellipse cx="-15" cy="21" rx="8" ry="20" fill="#E63946" opacity="0.9" transform="rotate(216)"/>
    <ellipse cx="-24" cy="-8" rx="8" ry="20" fill="#E63946" opacity="0.9" transform="rotate(288)"/>
    <circle cx="0" cy="0" r="6" fill="#F4A261"/>
  </g>

  <text x="200" y="360" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-size="32" font-weight="700" fill="#FFFFFF" letter-spacing="8">KAGERŌ</text>
  <line x1="120" y1="378" x2="280" y2="378" stroke="url(#ringGradient)" stroke-width="1.5" opacity="0.7"/>
  <text x="200" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#B0B0B0" letter-spacing="4" font-style="italic">陽炎 — HER HİKAYE BİR İZ BIRAKIR</text>
</svg>