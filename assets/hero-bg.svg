  <!-- Sis -->
  <ellipse cx="800" cy="850" rx="900" ry="100" fill="#2D1B3D" opacity="0.4" filter="url(#blur2)"/>
  
  <!-- Ön plandaki çiçekler -->
  <g opacity="0.9">
    <g transform="translate(200, 830)">
      <ellipse cx="0" cy="-25" rx="8" ry="20" fill="#E63946"/>
      <ellipse cx="24" cy="-8" rx="8" ry="20" fill="#E63946" transform="rotate(72)"/>
      <ellipse cx="15" cy="21" rx="8" ry="20" fill="#E63946" transform="rotate(144)"/>
      <ellipse cx="-15" cy="21" rx="8" ry="20" fill="#E63946" transform="rotate(216)"/>
      <ellipse cx="-24" cy="-8" rx="8" ry="20" fill="#E63946" transform="rotate(288)"/>
      <circle r="6" fill="#F4A261"/>
    </g>
    <g transform="translate(1400, 850) scale(0.8)">
      <ellipse cx="0" cy="-25" rx="8" ry="20" fill="#E63946"/>
      <ellipse cx="24" cy="-8" rx="8" ry="20" fill="#E63946" transform="rotate(72)"/>
      <ellipse cx="15" cy="21" rx="8" ry="20" fill="#E63946" transform="rotate(144)"/>
      <ellipse cx="-15" cy="21" rx="8" ry="20" fill="#E63946" transform="rotate(216)"/>
      <ellipse cx="-24" cy="-8" rx="8" ry="20" fill="#E63946" transform="rotate(288)"/>
      <circle r="6" fill="#F4A261"/>
    </g>
    <g transform="translate(800, 870) scale(0.6)">
      <ellipse cx="0" cy="-25" rx="8" ry="20" fill="#4A90D9"/>
      <ellipse cx="24" cy="-8" rx="8" ry="20" fill="#4A90D9" transform="rotate(72)"/>
      <ellipse cx="15" cy="21" rx="8" ry="20" fill="#4A90D9" transform="rotate(144)"/>
      <ellipse cx="-15" cy="21" rx="8" ry="20" fill="#4A90D9" transform="rotate(216)"/>
      <ellipse cx="-24" cy="-8" rx="8" ry="20" fill="#4A90D9" transform="rotate(288)"/>
      <circle r="6" fill="#F4A261"/>
    </g>
  </g>
  
  <!-- Uçuşan yapraklar -->
  <g fill="#E63946" opacity="0.4">
    <ellipse cx="400" cy="500" rx="3" ry="6" transform="rotate(30 400 500)"/>
    <ellipse cx="700" cy="450" rx="3" ry="6" transform="rotate(-20 700 450)"/>
    <ellipse cx="1000" cy="520" rx="3" ry="6" transform="rotate(60 1000 520)"/>
    <ellipse cx="1300" cy="480" rx="3" ry="6" transform="rotate(-40 1300 480)"/>
