  <!-- Işıklı pencereler -->
  <g fill="#E63946" opacity="0.5">
    <rect x="160" y="680" width="4" height="6"/>
    <rect x="180" y="700" width="4" height="6"/>
    <rect x="290" y="760" width="4" height="6"/>
    <rect x="430" y="720" width="4" height="6"/>
    <rect x="650" y="740" width="4" height="6"/>
