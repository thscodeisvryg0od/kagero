<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg512" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#2D1B3D"/>
      <stop offset="70%" stop-color="#1A0A1A"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="ring512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E63946"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="glow512">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <!-- Arka plan: yuvarlak köşeli kare -->
  <rect width="512" height="512" fill="url(#bg512)" rx="100"/>
  
  <!-- Dış halka (kalın) -->
  <circle cx="256" cy="256" r="182" fill="none" stroke="url(#ring512)" stroke-width="8"/>
  
  <!-- İç halka (ince) -->
  <circle cx="256" cy="256" r="144" fill="none" stroke="url(#ring512)" stroke-width="3" opacity="0.5"/>
  
  <!-- Çiçek — ortada, büyük -->
  <g filter="url(#glow512)" transform="translate(256,256)">
    <ellipse cx="0" cy="-70" rx="22" ry="56" fill="#E63946"/>
    <ellipse cx="67" cy="-22" rx="22" ry="56" fill="#E63946" transform="rotate(72)"/>
    <ellipse cx="41" cy="57" rx="22" ry="56" fill="#E63946" transform="rotate(144)"/>
    <ellipse cx="-41" cy="57" rx="22" ry="56" fill="#E63946" transform="rotate(216)"/>
    <ellipse cx="-67" cy="-22" rx="22" ry="56" fill="#E63946" transform="rotate(288)"/>
    <circle r="18" fill="#F4A261"/>
  </g>
</svg>