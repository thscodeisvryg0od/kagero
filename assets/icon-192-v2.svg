<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <radialGradient id="bgGrad192" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#2D1B3D"/>
      <stop offset="60%" stop-color="#1A0A1A"/>
      <stop offset="100%" stop-color="#0A0510"/>
    </radialGradient>
    <radialGradient id="flowerGlow192" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E63946" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#E63946" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Tam kanlı arka plan -->
  <rect width="192" height="192" fill="url(#bgGrad192)"/>
  
  <!-- Çiçek glow (yumuşak parlaklık) -->
  <circle cx="96" cy="96" r="70" fill="url(#flowerGlow192)"/>
  
  <!-- Tek ince altın halka (safe zone içinde) -->
  <circle cx="96" cy="96" r="72" fill="none" stroke="#D4A017" stroke-width="1" opacity="0.3"/>
  
  <!-- Çiçek — BÜYÜK, KALIN, NET -->
  <g transform="translate(96,96)">
    <!-- 5 yaprak -->
    <ellipse cx="0" cy="-32" rx="11" ry="26" fill="#E63946"/>
    <ellipse cx="30" cy="-10" rx="11" ry="26" fill="#E63946" transform="rotate(72)"/>
    <ellipse cx="19" cy="26" rx="11" ry="26" fill="#E63946" transform="rotate(144)"/>
    <ellipse cx="-19" cy="26" rx="11" ry="26" fill="#E63946" transform="rotate(216)"/>
    <ellipse cx="-30" cy="-10" rx="11" ry="26" fill="#E63946" transform="rotate(288)"/>
    
    <!-- Merkez altın -->
    <circle r="9" fill="#F4A261"/>
    <circle r="4" fill="#FFD88C"/>
  </g>
</svg>